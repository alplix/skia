[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skia"
version = "0.1.0"
description = "Simulated strong lens imaging for the Skia feasibility study"
requires-python = ">=3.14,<3.15"
dependencies = ["herculens==0.3.0", "lenstronomy==1.13.2", "jax==0.12.0.1", "numpy==2.5.4", "scipy==1.18.1", "astropy==8.0.2", "pyyaml==6.0.3"]

[project.scripts]
skia-fit = "skia.cli:main"
skia-scan = "skia.scan_cli:main"
skia-app = "skia.app_cli:main"
skia-bundle = "skia.bundle_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
